<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lysliste — Den Lukkede Bog</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Mono','Fira Code','Courier New',monospace;background:#f5f3ef;color:#1a1a1a;min-height:100vh}:root{--accent:#c47a00;--green:#2e7d32;--border:#e0dbd0;--bg:#f5f3ef;--card:#fff;--subtle:#f0ece4;--muted:#999}#header{background:var(--card);border-bottom:2px solid var(--accent);padding:20px 24px 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.07)}#header-inner{max-width:800px;margin:0 auto}#header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.subtitle{font-size:11px;color:var(--accent);letter-spacing:3px;margin-bottom:4px;font-weight:600}.title{font-size:24px;font-weight:700;color:#111}.header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#online-count{font-size:11px;color:var(--green);background:#f0faf0;border:1px solid #a5d6a7;padding:4px 10px;border-radius:20px}#btn-reset{background:transparent;border:1.5px solid #ccc;color:#888;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px;letter-spacing:2px;font-family:inherit}#progress-bar-wrap{margin-top:14px}#progress-labels{display:flex;justify-content:space-between;margin-bottom:7px;font-size:13px;color:var(--muted)}#progress-pct{font-weight:700}#progress-track{height:6px;background:#e8e4dc;border-radius:3px}#progress-fill{height:100%;width:0%;background:var(--accent);border-radius:3px;transition:width .3s ease}#toolbar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}#search{flex:1;min-width:140px;background:var(--bg);border:1.5px solid #ddd;color:#1a1a1a;padding:8px 12px;border-radius:4px;font-size:14px;font-family:inherit;outline:none}.filter-btn{padding:8px 14px;border-radius:4px;font-size:11px;letter-spacing:1.5px;font-family:inherit;cursor:pointer;border:1.5px solid #ddd;background:var(--card);color:var(--muted)}.filter-btn.active{border-color:var(--accent);background:#fdf3e0;color:var(--accent);font-weight:700}#content{max-width:800px;margin:0 auto;padding:18px 16px 80px}.cat-block{margin-bottom:10px}.cat-header{width:100%;display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-left:4px solid var(--accent);padding:12px 16px;cursor:pointer;color:#1a1a1a;font-family:inherit;text-align:left;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.cat-header.done{border-color:#a5d6a7;border-left-color:var(--green);background:#f0faf0}.cat-emoji{font-size:17px}.cat-label{flex:1;font-size:13px;letter-spacing:2px;font-weight:700;color:#333}.cat-header.done .cat-label{color:var(--green)}.cat-count{font-size:13px;color:var(--muted);font-weight:600}.cat-header.done .cat-count{color:var(--green)}.cat-arrow{font-size:11px;color:#bbb;margin-left:8px}.cat-items{background:var(--card);border:1.5px solid var(--border);border-top:none;margin-left:4px;border-radius:0 0 6px 6px;overflow:hidden}.item-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--subtle);background:transparent}.item-row.checked{background:#f6fbf6}.chk{width:24px;height:24px;min-width:24px;border:2px solid #ccc;border-radius:4px;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}.chk.checked{background:var(--green);border-color:var(--green)}.chk svg{display:none}.chk.checked svg{display:block}.item-text{flex:1;font-size:15px;color:#222;line-height:1.5}.item-row.checked .item-text{color:#aaa;text-decoration:line-through}.item-custom-tag{font-size:10px;color:#c4960066;margin-left:8px}.item-delete{background:transparent;border:none;color:#ccc;cursor:pointer;font-size:18px;padding:0 2px}.add-row{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--subtle);background:#fafaf8}.add-input{flex:1;background:var(--card);border:1.5px solid var(--accent);color:#1a1a1a;padding:8px 12px;border-radius:4px;font-size:14px;font-family:inherit;outline:none}.btn-add{background:var(--accent);border:none;color:#fff;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit}.btn-cancel{background:transparent;border:1.5px solid #ddd;color:#aaa;padding:8px 12px;border-radius:4px;cursor:pointer;font-family:inherit}.btn-add-trigger{width:100%;background:#fafaf8;border:none;border-top:1px solid var(--subtle);color:#bbb;padding:10px 16px;text-align:left;cursor:pointer;font-size:13px;font-family:inherit;letter-spacing:1px}#empty{text-align:center;color:#bbb;padding:60px 0;font-size:15px;display:none}#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);align-items:center;justify-content:center;z-index:100}#modal-overlay.show{display:flex}#modal{background:var(--card);border:2px solid var(--accent);border-radius:8px;padding:32px 36px;max-width:360px;width:90%;text-align:center}.modal-title{font-size:13px;letter-spacing:3px;color:var(--accent);margin-bottom:14px;font-weight:700}.modal-body{font-size:15px;color:#666;margin-bottom:28px;line-height:1.7}.modal-btns{display:flex;gap:12px;justify-content:center}#btn-confirm{background:var(--accent);border:none;color:#fff;padding:12px 28px;border-radius:5px;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit}#btn-cancel-modal{background:transparent;border:1.5px solid #ddd;color:#999;padding:12px 20px;border-radius:5px;cursor:pointer;font-family:inherit}#hint{position:fixed;bottom:16px;right:16px;background:var(--card);border:1px solid var(--border);border-radius:4px;padding:7px 12px;font-size:12px;color:#aaa;box-shadow:0 2px 8px rgba(0,0,0,.06)}</style></head><body>
<div id="header"><div id="header-inner"><div id="header-top"><div><div class="subtitle">DEN LUKKEDE BOG · LOCATION</div><div class="title">LYSLISTE CHECKLIST</div></div><div class="header-right"><span id="online-count">● FORBINDER...</span><button id="btn-reset">↺ NULSTIL</button></div></div><div id="progress-bar-wrap"><div id="progress-labels"><span id="progress-text">0 / 0 pakket</span><span id="progress-pct" style="color:var(--accent)">0%</span></div><div id="progress-track"><div id="progress-fill"></div></div></div><div id="toolbar"><input id="search" type="text" placeholder="Søg..."><button class="filter-btn active" data-filter="all">ALLE</button><button class="filter-btn" data-filter="unchecked">MANGLER</button><button class="filter-btn" data-filter="checked">PAKKET</button></div></div></div>
<div id="content"><div id="empty">INGEN RESULTATER</div></div>
<div id="modal-overlay"><div id="modal"><div class="modal-title">NULSTIL LISTE</div><div class="modal-body">Alle flueben nulstilles for <strong>alle brugere</strong>.<br>Tilføjede elementer bevares.</div><div class="modal-btns"><button id="btn-confirm">NULSTIL</button><button id="btn-cancel-modal">Annuller</button></div></div></div>
<div id="hint">🔴 Delt realtidsliste — alle ser ændringer live</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getDatabase,ref,onValue,update,remove}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const cfg={apiKey:"AIzaSyARogN0V8ZJeVGrvUmwhycXfy1R_bQccLk",authDomain:"filmworktime.firebaseapp.com",databaseURL:"https://filmworktime-default-rtdb.europe-west1.firebasedatabase.app",projectId:"filmworktime",storageBucket:"filmworktime.firebasestorage.app",messagingSenderId:"290576525933",appId:"1:290576525933:web:9771881a4471248b6c2d64"};
const db=getDatabase(initializeApp(cfg));
const ROOT="lysliste-den-lukkede-bog";
const CATS=[{id:"transport",label:"TRANSPORT",emoji:"🚛",items:[{id:"t1",text:"1 x Lastvogn (Bedst) eller 2 x 3.5t Alu. m. lift"}]},{id:"lyskilder",label:"LYSKILDER",emoji:"💡",items:[{id:"l1",text:"2 x Sharks (hænge + Junior spigot, kalibrerede)"},{id:"l2",text:"2 x Skypanel 360"},{id:"l3",text:"3 x Vortex 8"},{id:"l4",text:"2 x Celeb 850 + 2x honeycombe til hver"},{id:"l5",text:"4 x Hyperion"},{id:"l6",text:"8 x Titan (et sæt) m. Fabric"},{id:"l7",text:"4 x Titan LightSock"},{id:"l8",text:"8 x Helios (et sæt) m. Fabric"},{id:"l9",text:"4 x Helios LightSock"},{id:"l10",text:"1 x Pluto m. Profil"},{id:"l11",text:"2 x QuickSpot"},{id:"l12",text:"2 x PixelBrick"}]},{id:"petroleum",label:"PETROLEUM PRACTICALS",emoji:"🕯️",items:[{id:"p1",text:"4 x Sunricher LED DMX dekodere, 5x8A m. 12V strømforsyning"}]},{id:"dmx",label:"DMX STYRING",emoji:"🎛️",items:[{id:"d1",text:"1 x MacBook Pro — App: MadMapper"},{id:"d2",text:"2 x iPad Pro — Luminair 4 + Blackout 2 Universe"},{id:"d3",text:"1 x Stardust"},{id:"d4",text:"1 x Enttec Ode eller Storm10"},{id:"d5",text:"10 x Moonlite"},{id:"d6",text:"1 x Lumindim micro 4 channel"},{id:"d7",text:"2 x Mikrotik wAP AP + Bridge"},{id:"d8",text:"1 x Asterabox"}]},{id:"hue",label:"HUE PRACTICAL KIT",emoji:"🌡️",items:[{id:"h1",text:"20 x Hue Filament"},{id:"h2",text:"1 x Hue Bridge Pro"}]},{id:"el",label:"EL",emoji:"⚡",items:[{id:"e1",text:"2 x Mixbox"},{id:"e2",text:"60m 3x16A"},{id:"e3",text:"200m DK"},{id:"e4",text:"10 x tristik"},{id:"e5",text:"4 x Overgange"}]},{id:"batterier",label:"BATTERIER",emoji:"🔋",items:[{id:"b1",text:"1 x 10KW"},{id:"b2",text:"2 x Ecoflow Pro"}]},{id:"chimera",label:"CHIMERA",emoji:"🪟",items:[{id:"c1",text:"1 x Octa 5/7"},{id:"c2",text:"1 x L Pancake m. Arri 800W speedring"},{id:"c3",text:"1 x M Pancake m. Arri 800W speedring"},{id:"c4",text:"2 x 42x72 Panelframe"},{id:"c5",text:"2 x 72x72 Panelframe"}]},{id:"stativer",label:"STATIVER",emoji:"🏗️",items:[{id:"s1",text:"4 x John Silver"},{id:"s2",text:"2 x John Silver LowBoy"},{id:"s3",text:"1 x MaxBoom m. 120kg Skiver + sikkerhedssplit"},{id:"s4",text:"3 x SuperWindUp"},{id:"s5",text:"6 x Combo"},{id:"s6",text:"4 x Lowboy"},{id:"s7",text:"1 x MiniMax"},{id:"s8",text:"10 x CStand"},{id:"s9",text:"2 x mini CStand"},{id:"s10",text:"2 x 16mm gulvfod"},{id:"s11",text:"2 x Turtle"}]},{id:"rammer",label:"RAMMER M.M.",emoji:"🖼️",items:[{id:"r1",text:"1 x 12x20 — 1/1, 1/2, 1/4 Diff + Ultrabounce"},{id:"r2",text:"1 x 12x12 — 1/1, 1/2, 1/4 Diff + Ultrabounce"},{id:"r3",text:"2 x 3x3m sort T-bar"},{id:"r4",text:"2 x 1,35x3m sort T-bar"},{id:"r5",text:"2 x 3x3 hvid T-bar"},{id:"r6",text:"2 x 1,35x3m hvid T-bar"},{id:"r7",text:"1 x St. Flagbox m. Alm filtre"},{id:"r8",text:"4 x Floppy"},{id:"r9",text:"2 x L Cutter (gerne floppy)"},{id:"r10",text:"2 x Empty Frame Alm."},{id:"r11",text:"2 x Empty Frame Lille"}]},{id:"egripment",label:"EGRIPMENT",emoji:"🔧",items:[{id:"g1",text:"4 x Lang cartelini"},{id:"g2",text:"6 x Kort cartelini"},{id:"g3",text:"20 x Superclamp"},{id:"g4",text:"6 x Gaffergrib"},{id:"g5",text:"6 x S Ponyclamps"},{id:"g6",text:"2 x vinkel led"},{id:"g7",text:"8 x babyplates"},{id:"g8",text:"2 x sparrow plates"},{id:"g9",text:"2 x Magic arm"},{id:"g10",text:"4 x BigBen"},{id:"g11",text:"1 x UngaBunga Junior extn."},{id:"g12",text:"1 x T-bar, Junior"},{id:"g13",text:"1 x T-Bar 16mm"},{id:"g14",text:"2 x kort goboarm, ca.25cm"},{id:"g15",text:"6 x Lille gobohoved"},{id:"g16",text:"2 x Stor gobohoved"},{id:"g17",text:"1 x Matthews spejl"},{id:"g18",text:"10 x sikkerhedswire"},{id:"g19",text:"20 x lange remme"},{id:"g20",text:"20 x korte remme"},{id:"g21",text:"6 x 10m reb"},{id:"g22",text:"4 x apple box set"},{id:"g23",text:"4 ps. Klemmer"},{id:"g24",text:"20 Shotbags"}]},{id:"materialer",label:"DIV. MATERIALER",emoji:"📦",items:[{id:"m1",text:"1 rl. 1/4 + 1/2 Hampshire"},{id:"m2",text:"2 rl. Blackwrap"},{id:"m3",text:"2 rl. Sort papir tape"},{id:"m4",text:"1 rl. Hvid og sølv gaffer tape"},{id:"m5",text:"1 rl. Black Tack"},{id:"m6",text:"1 rl. 1,5 mm²"},{id:"m7",text:"10m Sort Scenemolton"},{id:"m8",text:"10m Taft, 3m bred"},{id:"m9",text:"1 rl sort deko molton"},{id:"m10",text:"1 rl hvid deko molton"},{id:"m11",text:"20m +/- Stigetræ"}]},{id:"div",label:"DIV. UDSTYR",emoji:"🪜",items:[{id:"u1",text:"1 x 'Tjalle' Reol m. 4 niveauer + Grønne kasser"},{id:"u2",text:"1 x Musclecart"},{id:"u3",text:"2 x sækkevogn"},{id:"u4",text:"1 x Stor Skyde/Winerstige"},{id:"u5",text:"1 x Combi stige"},{id:"u6",text:"1 x Maler stige, 6 trin"},{id:"u7",text:"1 x Maler stige, 4 trin"},{id:"u8",text:"Alm. Værktøj"}]}];
let S={checked:{},collapsed:{},custom:{}};let FM='all',ST='';
onValue(ref(db,ROOT),s=>{S=s.val()||{checked:{},collapsed:{},custom:{}};['checked','collapsed','custom'].forEach(k=>{if(!S[k])S[k]={};});render();const el=document.getElementById('online-count');el.textContent='● LIVE';el.style.color='var(--green)';},()=>{document.getElementById('online-count').textContent='● OFFLINE';});
function fu(p,v){const u={};u[ROOT+'/'+p]=v;update(ref(db),u);}
function fr(p){remove(ref(db,ROOT+'/'+p));}
function gc(){return CATS.map(c=>({...c,items:[...c.items,...(S.custom[c.id]||[]).map(i=>({...i,custom:true}))]}));}
function render(){
  const cats=gc();const tot=cats.reduce((n,c)=>n+c.items.length,0);const chk=Object.values(S.checked).filter(Boolean).length;const pct=tot?Math.round(chk/tot*100):0;
  document.getElementById('progress-text').textContent=chk+' / '+tot+' pakket';
  const pe=document.getElementById('progress-pct');pe.textContent=pct+'%';pe.style.color=pct===100?'var(--green)':'var(--accent)';
  const fi=document.getElementById('progress-fill');fi.style.width=pct+'%';fi.style.background=pct===100?'var(--green)':'var(--accent)';
  const cont=document.getElementById('content');cont.querySelectorAll('.cat-block').forEach(e=>e.remove());
  const vis=cats.map(cat=>({...cat,items:cat.items.filter(it=>{const ms=!ST||it.text.toLowerCase().includes(ST.toLowerCase());const mf=FM==='all'||(FM==='checked'&&S.checked[it.id])||(FM==='unchecked'&&!S.checked[it.id]);return ms&&mf;})})).filter(c=>c.items.length>0);
  document.getElementById('empty').style.display=vis.length?'none':'block';
  vis.forEach(cat=>{
    const cc=cat.items.filter(i=>S.checked[i.id]).length,ct=cat.items.length,done=cc===ct&&ct>0,coll=S.collapsed[cat.id];
    const blk=document.createElement('div');blk.className='cat-block';
    const hdr=document.createElement('button');hdr.className='cat-header'+(done?' done':'');
    hdr.innerHTML='<span class="cat-emoji">'+cat.emoji+'</span><span class="cat-label">'+cat.label+'</span><span class="cat-count">'+cc+'/'+ct+'</span><span class="cat-arrow">'+(coll?'▶':'▼')+'</span>';
    hdr.onclick=()=>fu('collapsed/'+cat.id,!S.collapsed[cat.id]);blk.appendChild(hdr);
    if(!coll){
      const lst=document.createElement('div');lst.className='cat-items';
      cat.items.forEach(it=>{
        const row=document.createElement('div');row.className='item-row'+(S.checked[it.id]?' checked':'');
        const cb=document.createElement('button');cb.className='chk'+(S.checked[it.id]?' checked':'');
        cb.innerHTML='<svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1 5L4.5 8.5L12 1" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        cb.onclick=()=>fu('checked/'+it.id,!S.checked[it.id]);
        const tx=document.createElement('span');tx.className='item-text';tx.textContent=it.text;
        if(it.custom){const tg=document.createElement('span');tg.className='item-custom-tag';tg.textContent='TILFØJET';tx.appendChild(tg);}
        row.appendChild(cb);row.appendChild(tx);
        if(it.custom){const dl=document.createElement('button');dl.className='item-delete';dl.textContent='×';dl.onclick=()=>{const nl=(S.custom[cat.id]||[]).filter(i=>i.id!==it.id);fu('custom/'+cat.id,nl.length?nl:null);fr('checked/'+it.id);};row.appendChild(dl);}
        lst.appendChild(row);
      });
      const at=document.createElement('button');at.className='btn-add-trigger';at.textContent='+ TILFØJ ELEMENT';
      const af=document.createElement('div');af.className='add-row';af.style.display='none';
      const ai=document.createElement('input');ai.className='add-input';ai.placeholder='Nyt element...';
      const ba=document.createElement('button');ba.className='btn-add';ba.textContent='＋';
      const bc=document.createElement('button');bc.className='btn-cancel';bc.textContent='✕';
      at.onclick=()=>{at.style.display='none';af.style.display='flex';ai.focus();};
      const doAdd=()=>{const t=ai.value.trim();if(t){fu('custom/'+cat.id,[...(S.custom[cat.id]||[]),{id:'c'+Date.now(),text:t}]);}};
      ai.onkeydown=e=>{if(e.key==='Enter')doAdd();if(e.key==='Escape')render();};
      ba.onclick=doAdd;bc.onclick=render;
      af.appendChild(ai);af.appendChild(ba);af.appendChild(bc);
      lst.appendChild(at);lst.appendChild(af);blk.appendChild(lst);
    }
    cont.appendChild(blk);
  });
  cont.appendChild(document.getElementById('empty'));
}
document.querySelectorAll('.filter-btn').forEach(btn=>{btn.onclick=()=>{FM=btn.dataset.filter;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter===FM));render();};});
document.getElementById('search').oninput=e=>{ST=e.target.value;render();};
document.getElementById('btn-reset').onclick=()=>document.getElementById('modal-overlay').classList.add('show');
document.getElementById('btn-cancel-modal').onclick=()=>document.getElementById('modal-overlay').classList.remove('show');
document.getElementById('btn-confirm').onclick=()=>{fr('checked');document.getElementById('modal-overlay').classList.remove('show');};
</script></body></html>
